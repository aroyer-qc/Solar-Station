<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SolarStation Configuration</title>
    <style>
        :root {
            --bg: #f6f0e5;
            --panel: #fffaf2;
            --line: #d9c9a8;
            --ink: #203028;
            --accent: #2c7a5a;
            --accent-2: #cf6a32;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Georgia, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top right, #f6d9a6 0, transparent 28%),
                linear-gradient(180deg, #faf4ea 0%, var(--bg) 100%);
        }
        .shell {
            max-width: 1080px;
            margin: 0 auto;
            padding: 24px;
        }
        .hero {
            display: grid;
            gap: 16px;
            grid-template-columns: 2fr 1fr;
            margin-bottom: 24px;
        }
        .panel {
            background: rgba(255, 250, 242, 0.92);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(75, 58, 31, 0.08);
        }
        h1, h2, h3 { margin-top: 0; }
        h1 { font-size: 2.2rem; margin-bottom: 8px; }
        .subtle { color: #58685f; }
        .stats {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }
        .stat {
            padding: 16px;
            border-radius: 14px;
            background: #fff;
            border: 1px solid #eadfc7;
        }
        .stat strong {
            display: block;
            font-size: 1.4rem;
            margin-top: 8px;
        }
        .stat .mini {
            display: block;
            margin-top: 8px;
            font-size: 0.82rem;
            color: #58685f;
        }
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .badge-manual {
            background: #efe5d2;
            border-color: #d9c9a8;
            color: #6a5130;
        }
        .badge-auto-active {
            background: #dcefdc;
            border-color: #91bc91;
            color: #285c2f;
        }
        .badge-auto-idle {
            background: #e7efe7;
            border-color: #b6c7b7;
            color: #4f6c55;
        }
        .badge-auto-wait {
            background: #f8e5cf;
            border-color: #d7a26d;
            color: #8f4f1e;
        }
        .badge-auto-disabled {
            background: #f1e2d7;
            border-color: #caa58a;
            color: #7b5740;
        }
        .diag-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            margin-top: 18px;
        }
        .diag-box {
            padding: 14px;
            border-radius: 14px;
            background: #fff;
            border: 1px solid #eadfc7;
        }
        .diag-box strong {
            display: block;
            margin-bottom: 8px;
        }
        .signal-grid {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
        }
        .signal-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            border-radius: 12px;
            background: #faf7f0;
            border: 1px solid #eadfc7;
        }
        .signal-item label {
            margin: 0;
            font-size: 0.8rem;
            font-weight: 700;
            color: #58685f;
        }
        .badge-signal-active {
            background: #f8e0d5;
            border-color: #db9877;
            color: #8c3e1d;
        }
        .badge-signal-fault {
            background: #f2d0c5;
            border-color: #c76b45;
            color: #7e2c12;
            animation: faultPulse 1.1s ease-in-out infinite;
        }
        @keyframes faultPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(199, 107, 69, 0.25);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 0 7px rgba(199, 107, 69, 0.0);
            }
        }
        .badge-signal-ok {
            background: #dcefdc;
            border-color: #91bc91;
            color: #285c2f;
        }
        .badge-signal-idle {
            background: #e7efe7;
            border-color: #b6c7b7;
            color: #4f6c55;
        }
        .led {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
            border: 1px solid rgba(32, 48, 40, 0.25);
            background: #b9b9b9;
        }
        .led-waiting {
            background: #f4c542;
            box-shadow: 0 0 8px rgba(244, 197, 66, 0.7);
        }
        .led-ok {
            background: #2aa24e;
            box-shadow: 0 0 10px rgba(42, 162, 78, 0.75);
        }
        .led-error {
            background: #d5443d;
            box-shadow: 0 0 10px rgba(213, 68, 61, 0.75);
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .nav .tablink {
            display: inline-block;
            text-decoration: none;
            border: 0;
            border-radius: 999px;
            padding: 10px 16px;
            cursor: pointer;
            background: #eadfc7;
            color: var(--ink);
            font-weight: 600;
        }
        .nav .tablink.active {
            background: var(--accent);
            color: #fff;
        }
        .tabcontent { display: none; }
        .tabcontent.active { display: block; }
        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        .schedule-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .schedule-output {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.54);
        }
        .schedule-slot {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }
        .schedule-slot h4 { margin: 0 0 10px; }
        .schedule-days {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            margin: 14px 0 4px;
            padding: 8px 0 0;
            border: 0;
        }
        .schedule-days legend { font-weight: 600; }
        .schedule-days label { margin: 0; font-size: 0.9rem; }
        .shared-stepper-panel {
            margin-bottom: 18px;
        }
        .shared-stepper-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px 16px;
            align-items: start;
        }
        .shared-stepper-form {
            display: grid;
            gap: 14px 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            align-items: end;
        }
        .shared-stepper-form .field label {
            margin-top: 0;
        }
        .shared-stepper-buttons {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            margin-top: 0;
            margin-left: auto;
            width: auto;
            align-self: start;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
        }
        input[type=text], input[type=number], input[type=password] {
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
        }
        input[type=checkbox] { margin-right: 8px; }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .range-ok {
            color: #1f8a3b;
        }
        .range-bad {
            color: #bf1e1e;
        }
        input[type=submit], button.action {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }
        button.action.is-current-state {
            box-shadow:
                inset 0 0 0 3px rgba(255, 255, 255, 0.92),
                0 0 0 4px rgba(255, 217, 84, 0.92),
                0 0 24px rgba(255, 191, 64, 0.78),
                0 8px 18px rgba(32, 48, 40, 0.28);
            filter: saturate(1.45) brightness(1.08);
            transform: translateY(-1px) scale(1.02);
        }
        button.action:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        button.warning { background: var(--accent-2); }
        @media (max-width: 760px) {
            .hero { grid-template-columns: 1fr; }
            .shared-stepper-layout { grid-template-columns: 1fr; }
            .schedule-grid { grid-template-columns: 1fr; }
            .shared-stepper-buttons {
                align-items: flex-start;
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="panel">
            <h1>Configuration</h1>
            <div class="actions">
                <button class="action" onclick="window.location.href='/portal'">Back to main page</button>
            </div>
        </section>

<section id="config" class="tabcontent active">
            <div class="panel shared-stepper-panel">
                <h2>Stepper Drive</h2>
                <p class="subtle">Microstep mode is shared by all stepper drivers.</p>
                <div class="shared-stepper-layout">
                    <form action="/saveStepperConfig" method="POST" class="shared-stepper-form" id="sharedStepperSaveForm">
                        <div class="field">
                            <label for="stepper1MotorStepsPerRevolution">Motor 1 (Azimuth) full steps per revolution</label>
                            <input type="number" id="stepper1MotorStepsPerRevolution" name="stepper1MotorStepsPerRevolution" min="1" step="1" value="{{stepper1MotorStepsPerRevolution}}">
                        </div>

                        <div class="field">
                            <label for="stepper2MotorStepsPerRevolution">Motor 2 (Elevation) full steps per revolution</label>
                            <input type="number" id="stepper2MotorStepsPerRevolution" name="stepper2MotorStepsPerRevolution" min="1" step="1" value="{{stepper2MotorStepsPerRevolution}}">
                        </div>

                        <div class="field">
                            <label for="stepper3MotorStepsPerRevolution">Motor 3 full steps per revolution</label>
                            <input type="number" id="stepper3MotorStepsPerRevolution" name="stepper3MotorStepsPerRevolution" min="1" step="1" value="{{stepper3MotorStepsPerRevolution}}">
                        </div>

                        <div class="field">
                            <label for="stepperMicrostepMode">Microstep mode</label>
                            <select id="stepperMicrostepMode" name="stepperMicrostepMode">
                                <option value="8" {{stepperMicrostep8Selected}}>8</option>
                                <option value="16" {{stepperMicrostep16Selected}}>16</option>
                                <option value="32" {{stepperMicrostep32Selected}}>32</option>
                                <option value="64" {{stepperMicrostep64Selected}}>64</option>
                            </select>
                        </div>

                    </form>
                    <div class="shared-stepper-buttons">
                        <input type="submit" value="Save stepper drive" form="sharedStepperSaveForm">
                        <form action="/resetStepperConfig" method="POST" class="shared-stepper-reset" id="sharedStepperResetForm">
                            <input type="submit" value="Reset stepper drive">
                        </form>
                    </div>
                </div>
            </div>

            <div class="grid">
                <div class="panel">
                    <h2>Solar Tracking</h2>
                    <form action="/saveSolarTrackingConfig" method="POST">
                        <label for="stLatitude">Latitude (°)</label>
                        <input type="text" id="stLatitude" name="stLatitude" value="{{stLatitude}}">

                        <label for="stLongitude">Longitude (°)</label>
                        <input type="text" id="stLongitude" name="stLongitude" value="{{stLongitude}}">

                        <label for="stAltitude">Altitude (m)</label>
                        <input type="text" id="stAltitude" name="stAltitude" value="{{stAltitude}}">

                        <label for="stTimeZoneOffset">Timezone offset from UTC (hours)</label>
                        <input type="text" id="stTimeZoneOffset" name="stTimeZoneOffset" value="{{stTimeZoneOffset}}">

                        <label><input type="checkbox" name="stUseDST" {{stUseDSTChecked}}>Apply daylight saving time (+1h)</label>

                        <label for="stPressure">Pressure (kPa)</label>
                        <input type="text" id="stPressure" name="stPressure" value="{{stPressure}}">

                        <label for="stTemperature">Temperature (C)</label>
                        <input type="text" id="stTemperature" name="stTemperature" value="{{stTemperature}}">

                        <div class="actions">
                            <input type="submit" value="Save solar tracking">
                        </div>
                    </form>
                    <form action="/resetSolarTrackingConfig" method="POST">
                        <div class="actions">
                            <input type="submit" value="Reset solar tracking">
                        </div>
                    </form>
                </div>

                <div class="panel">
                    <h2>Azimuth (Motor 1)</h2>
                    <form action="/saveAzimuthConfig" method="POST">
                        <label for="azimuthDegMax">Maximum azimuth (°)</label>
                        <input type="text" id="azimuthDegMax" name="azimuthDegMax" value="{{azDegMax}}">

                        <label for="azimuthDegMin">Minimum azimuth (°)</label>
                        <input type="text" id="azimuthDegMin" name="azimuthDegMin" value="{{azDegMin}}">

                        <label for="azimuthGearReduction">Azimuth reduction ratio</label>
                        <input type="text" id="azimuthGearReduction" name="azimuthGearReduction" value="{{azGearReduction}}">

                        <label for="azimuthStepsPerDegreeComputed">Azimuth steps per degree (calculated)</label>
                        <input type="text" id="azimuthStepsPerDegreeComputed" value="{{azStepsPerDegreeComputed}}" readonly>

                        <label for="azimuthStepSpeedHz">Azimuth speed (steps/s)</label>
                        <input type="number" id="azimuthStepSpeedHz" name="azimuthStepSpeedHz" min="1" value="{{azStepSpeedHz}}">

                        <label for="azimuthStepAcceleration">Azimuth acceleration (steps/s²)</label>
                        <input type="number" id="azimuthStepAcceleration" name="azimuthStepAcceleration" min="1" value="{{azStepAcceleration}}">

                        <label for="azimuthTimeThreshold">Time threshold (ms)</label>
                        <input type="number" id="azimuthTimeThreshold" name="azimuthTimeThreshold" value="{{azTimeThreshold}}">

                        <div class="actions">
                            <input type="submit" value="Save azimuth">
                        </div>
                    </form>
                    <form action="/resetAzimuthConfig" method="POST">
                        <div class="actions">
                            <input type="submit" value="Reset azimuth">
                        </div>
                    </form>
                </div>

                <div class="panel">
                    <h2>Elevation (Motor 2)</h2>
                    <form action="/saveElevationConfig" method="POST">
                        <label for="elevationDegMax">Maximum elevation (°)</label>
                        <input type="text" id="elevationDegMax" name="elevationDegMax" value="{{elevDegMax}}">

                        <label for="elevationDegMin">Minimum elevation (°)</label>
                        <input type="text" id="elevationDegMin" name="elevationDegMin" value="{{elevDegMin}}">

                        <label for="elevationGearReduction">Elevation reduction ratio</label>
                        <input type="text" id="elevationGearReduction" name="elevationGearReduction" value="{{elevGearReduction}}">

                        <label for="elevationStepsPerDegreeComputed">Elevation steps per degree (calculated)</label>
                        <input type="text" id="elevationStepsPerDegreeComputed" value="{{elevStepsPerDegreeComputed}}" readonly>

                        <label for="elevationStepSpeedHz">Elevation speed (steps/s)</label>
                        <input type="number" id="elevationStepSpeedHz" name="elevationStepSpeedHz" min="1" value="{{elevStepSpeedHz}}">

                        <label for="elevationStepAcceleration">Elevation acceleration (steps/s²)</label>
                        <input type="number" id="elevationStepAcceleration" name="elevationStepAcceleration" min="1" value="{{elevStepAcceleration}}">

                        <label for="elevationTimeThreshold">Time threshold (ms)</label>
                        <input type="number" id="elevationTimeThreshold" name="elevationTimeThreshold" value="{{elevTimeThreshold}}">

                        <div class="actions">
                            <input type="submit" value="Save elevation">
                        </div>
                    </form>
                    <form action="/resetElevationConfig" method="POST">
                        <div class="actions">
                            <input type="submit" value="Reset elevation">
                        </div>
                    </form>
                </div>
            </div>
        </section>

    </div>

    <script src="/portal/app.js"></script>
</body>
</html>
